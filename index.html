<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000" id="meta-theme">
  <title>RotaPro Navigasyon</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Minimalist AMOLED Açılış Ekranı -->
  <div id="splash">
    <div class="sp-content">
      <div class="sp-logo-box">
        <svg class="sp-icon" viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
        </svg>
      </div>
      <h1 class="sp-title">Rota<span>Pro</span></h1>
      <p class="sp-sub">MCT YAZILIM · MOBİL SÜRÜŞ ASİSTANI</p>
      <div class="sp-bar-wrap">
        <div class="sp-bar-fill"></div>
      </div>
      <div class="sp-pct">0%</div>
    </div>
  </div>

  <!-- Aşırı Hız Ekran Parlama Efekti -->
  <div id="ovr"></div>

  <!-- Harita Alanı -->
  <div id="map-wrap">
    <div id="map-rot">
      <div id="map"></div>
    </div>
  </div>

  <!-- Üst Navigasyon & Durum Çubuğu -->
  <div id="hdr" class="glass-panel">
    <div>
      <div class="hdr-title" id="hdr-road">Sürüşe Hazır</div>
      <div class="hdr-sub" id="is-loc">Konum Alınıyor...</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-icon" id="btn-compass" title="Pusula / Yön">🧭</button>
      <button class="btn-icon" id="btn-cfg" title="Ayarlar">⚙️</button>
    </div>
  </div>

  <!-- Dinamik Hız Sınırı Rozeti -->
  <div id="limit-badge" class="off">
    <div id="limit-num">--</div>
  </div>

  <!-- Dinamik Hız Göstergesi -->
  <div id="speed-dash" class="glass-panel">
    <div id="spd-val">0</div>
    <div id="spd-unit">KM/S</div>
  </div>

  <!-- Harita Sağ Kontrol Butonları -->
  <div style="position:fixed; right:16px; bottom:100px; z-index:1000; display:flex; flex-direction:column; gap:10px;">
    <button class="btn-icon" id="btn-recenter" title="Konuma Odaklan">🎯</button>
    <button class="btn-icon" id="btn-dest" title="Hedef Ara">🔍</button>
    <button class="btn-icon" id="btn-hazard" title="Tehlike Bildir">⚠️</button>
    <button class="btn-icon" id="btn-modes" title="Modlar & Araçlar">🛠️</button>
  </div>

  <!-- Rota Banner (Aktif Navigasyon Esnasında) -->
  <div id="nav-banner" class="glass-panel" style="position:fixed; top:80px; left:12px; right:12px; z-index:1000; padding:12px 16px; display:none; align-items:center; justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div id="nb-arrow" style="font-size:24px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </div>
      <div>
        <div id="nb-dist" style="font-size:18px; font-weight:800; color:var(--accent);">-- m</div>
        <div id="nb-txt" style="font-size:13px; font-weight:600; color:var(--text-primary);">Devam edin</div>
      </div>
    </div>
    <div style="text-align:right;">
      <div id="nb-eta" style="font-size:15px; font-weight:700; color:var(--green);">-- dk</div>
      <button id="nb-x" style="background:none; border:none; color:var(--red); font-size:12px; font-weight:700; cursor:pointer; margin-top:2px;">İptal</button>
    </div>
  </div>

  <!-- Alt Sayfalar / Sheet Panelleri -->
  
  <!-- Hedef Arama Sayfası -->
  <div id="dest-bg" class="sheet-bg">
    <div id="dest-sheet" class="sheet">
      <div id="dest-handle" class="sheet-handle"></div>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="dest-q" placeholder="Hedef, adres veya mekan ara..." style="flex:1; padding:12px 16px; border-radius:12px; border:1px solid var(--border-color); background:var(--bg-card); color:#fff; font-size:14px; outline:none;">
        <button id="dest-go" style="padding:12px 18px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:700; cursor:pointer;">Ara</button>
      </div>
      <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px;">
        <button class="quick-dest-btn" data-q="Ev">🏠 Ev</button>
        <button class="quick-dest-btn" data-q="İş Yeri">🏢 İş Yeri</button>
        <button class="quick-dest-btn" data-q="Benzin İstasyonu">⛽ Benzin</button>
        <button class="quick-dest-btn" data-q="Hastane">🏥 Hastane</button>
        <button class="quick-dest-btn" data-q="Otopark">🅿️ Otopark</button>
      </div>
      <button id="dest-pick" style="width:100%; padding:12px; border-radius:12px; border:1px dashed var(--accent); background:none; color:var(--accent); font-weight:700; cursor:pointer; margin-bottom:12px;">📍 Haritadan Konum Seç</button>
      
      <div id="dest-history-wrap" style="display:none; margin-top:10px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
          <div style="font-size:12px; font-weight:700; color:var(--text-secondary);">Son Gidilen Hedefler</div>
          <button id="dest-history-clear" style="background:none; border:none; color:var(--red); font-size:11px; font-weight:700; cursor:pointer;">Geçmişi Temizle</button>
        </div>
        <div id="dest-history" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>

      <div id="dest-res" style="display:flex; flex-direction:column; gap:6px;"></div>
      <button id="dest-close" style="width:100%; padding:12px; border-radius:12px; border:none; background:var(--bg-card); color:#fff; font-weight:700; cursor:pointer; margin-top:12px;">Kapat</button>
    </div>
  </div>

  <!-- Ayarlar Sayfası -->
  <div id="sheet-bg" class="sheet-bg">
    <div id="sheet" class="sheet">
      <div id="sheet-handle" class="sheet-handle"></div>
      <h3 style="margin-bottom:16px;">Uygulama Ayarları</h3>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>Araç Adı</span>
          <input type="text" id="cfg-car-name" style="padding:6px 10px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-card); color:#fff; width:120px; text-align:right;">
        </label>
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>Hız Sınırı Toleransı (%)</span>
          <input type="number" id="cfg-thr" value="10" style="padding:6px 10px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-card); color:#fff; width:70px; text-align:right;">
        </label>
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>Sesli Uyarılar (Bip)</span>
          <input type="checkbox" id="cfg-snd" checked>
        </label>
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>Sesli Yönlendirme (TTS)</span>
          <input type="checkbox" id="cfg-tts" checked>
        </label>
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>Ekranı Açık Tut</span>
          <input type="checkbox" id="cfg-wk" checked>
        </label>
      </div>
      <button id="btn-save" style="width:100%; padding:12px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; margin-top:20px;">Kaydet & Kapat</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
